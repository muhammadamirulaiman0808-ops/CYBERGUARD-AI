<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CyberGuard AI scans a website's HTTPS, SSL certificate and security headers, scores it out of 100 and lists what to fix first." />
    <meta name="theme-color" content="#060d14" />
    <title>CyberGuard AI</title>
    <script>
      // Apply the saved theme before the first paint so there is no flash. Dark is the default.
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
